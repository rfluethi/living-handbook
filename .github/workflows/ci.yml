name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Read-only by default. Nothing here writes to the repository; a job that ever
# needs more asks for it itself, so a compromised step in any other job gets a
# token that can read and nothing else.
permissions:
  contents: read

# Actions are pinned to a commit, with the release in the comment. A tag can be
# moved to other code after the fact, a commit cannot; Dependabot updates the
# pin and the comment together (see .github/dependabot.yml).

# A new push supersedes a running check of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      # Known vulnerabilities in any locked package, shipped or tooling. The
      # tooling runs on the code of every pull request, so it counts too.
      - name: Composer audit
        run: composer audit --locked --abandoned=report
      # uninstall.php deletes user content and is the most destructive file in
      # the plugin, so it belongs in both the lint and the analysis pass. bin/
      # and scoper.inc.php are build tooling: a syntax error there breaks the
      # release, which is the worst moment to find out.
      - name: PHP lint
        run: find living-handbook.php uninstall.php scoper.inc.php src bin -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: PHPCS
        run: composer lint
      - name: PHPStan
        run: composer analyze

  js-css:
    name: JavaScript and CSS lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node is development tooling only: the plugin ships the files in
      # assets/ as they are, with no build step, so this job only checks them
      # against the WordPress JavaScript and CSS standards.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install the lint tooling
        run: npm ci --no-fund
      - name: ESLint and Stylelint
        run: npm run lint
      # Prettier also runs inside ESLint for the scripts; this catches a file
      # that ESLint does not look at.
      - name: Formatting
        run: npx prettier --check "assets/**/*.js" "bin/**/*.js"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.1 is the declared minimum, 8.4 is what current hosts ship.
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

  plugin-check:
    name: Plugin Check (wordpress.org guidelines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The build tooling needs PHP 8.2, see release.yml. Composer still
      # resolves for 8.1, pinned in composer.json under config.platform.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      # The same pinned and hash-checked PHP-Scoper as the release, so what is
      # checked here is what a release would ship.
      - name: Install PHP-Scoper
        run: |
          mkdir -p tools
          curl -sSfL -o tools/php-scoper.phar \
            https://github.com/humbug/php-scoper/releases/download/0.18.19/php-scoper.phar
          echo "170fb84bd3390defb30f99f7dc39c9a89d10c29973accc26f31c00abc5b25933  tools/php-scoper.phar" | sha256sum -c -
      # Plugin Check runs against the built plugin, not the repository: the
      # repository holds tests, tooling and CI config that never ship and that
      # Plugin Check would rightly complain about.
      - name: Build the plugin ZIP
        run: |
          bash bin/build.sh
          mkdir -p build
          unzip -q living-handbook-*.zip -d build
      # Two groups of checks are left out, everything else stays strict.
      #
      # The five runtime checks of the Performance category load a demo page of
      # every viewable post type. They create it, then look it up with
      # get_posts() as a logged-out visitor. A handbook page in no handbook is
      # invisible to a visitor by design (AccessController::restrict_query fails
      # closed), so the lookup finds nothing and Plugin Check aborts the whole
      # run with "Unable to retrieve post URL for post type: handbook", before
      # it reports a single finding.
      #
      # offloading_files reports nine false positives: the GitHub host names of
      # the import's allowlist, the URL rewrite that turns a GitHub page address
      # into its raw file, and the privacy text that names GitHub and Gravatar.
      # The plugin fetches Markdown from GitHub on purpose and serves none of
      # its own assets from elsewhere. Explain both at the wordpress.org review.
      - name: Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: './build/living-handbook'
          exclude-checks: |
            enqueued_scripts_size
            enqueued_styles_size
            enqueued_scripts_scope
            enqueued_styles_scope
            non_blocking_scripts
            offloading_files
