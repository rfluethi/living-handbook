name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A new push supersedes a running check of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      # uninstall.php deletes user content and is the most destructive file in
      # the plugin, so it belongs in both the lint and the analysis pass.
      - name: PHP lint
        run: find living-handbook.php uninstall.php src -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: PHPCS
        run: composer lint
      - name: PHPStan
        run: composer analyze

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.1 is the declared minimum, 8.4 is what current hosts ship.
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit
