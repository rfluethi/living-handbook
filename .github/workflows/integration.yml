name: Integration

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # release.yml runs these same tests before it builds a release ZIP, so the
  # matrix is defined once, here.
  workflow_call:

# Read-only by default; nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration tests (WordPress ${{ matrix.wordpress }}${{ matrix.multisite && ', multisite' || '' }})
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Trunk is tested to see what is coming, not to decide whether a change is
    # good: a red trunk run is reported but does not fail the workflow.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        # Fixed releases, so a red run means the plugin changed, not WordPress.
        # The row that used to be called "latest" cloned the default branch of
        # WordPress/WordPress, which is trunk (7.2-beta at the time), so the
        # "current release" was never what it said.
        #
        # - 6.8.11: the declared minimum ("Requires at least: 6.8"), in its
        #   newest maintenance release, which is what a site on 6.8 runs.
        # - 7.1.3: the current release.
        # - trunk: the next release, allowed to fail.
        #
        # Move the numbers when a release or a maintenance release comes out;
        # git ls-remote --tags https://github.com/WordPress/WordPress.git lists
        # them.
        #
        # The multisite row runs the whole suite in a network with
        # subdirectories (E-0085); MultisiteTest runs only there.
        wordpress: [ '6.8.11', '7.1.3' ]
        experimental: [ false ]
        multisite: [ false ]
        include:
          - wordpress: trunk
            experimental: true
            multisite: false
          - wordpress: '7.1.3'
            experimental: false
            multisite: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: mysqli, zip, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # wp-phpunit ships the test framework but not WordPress itself, so a core
      # checkout is needed for ABSPATH. This mirrors the local recipe in
      # CONTRIBUTING.md.
      - name: Download WordPress core
        env:
          WP_REF: ${{ matrix.wordpress }}
        run: |
          if [ "$WP_REF" = "trunk" ]; then
            git clone --depth=1 https://github.com/WordPress/WordPress.git /tmp/wordpress
          else
            git clone --depth=1 --branch "$WP_REF" https://github.com/WordPress/WordPress.git /tmp/wordpress
          fi
          grep "wp_version =" /tmp/wordpress/wp-includes/version.php

      - name: Write wp-tests-config
        run: |
          cat > wp-tests-config.php <<'PHP'
          <?php
          define( 'ABSPATH', '/tmp/wordpress/' );
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          $table_prefix = 'wptests_';
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'Test' );
          define( 'WP_PHP_BINARY', 'php' );
          PHP

      - name: Run integration tests
        env:
          LH_INTEGRATION: 1
          WP_MULTISITE: ${{ matrix.multisite && '1' || '0' }}
          WP_TESTS_CONFIG_FILE_PATH: ${{ github.workspace }}/wp-tests-config.php
        run: vendor/bin/phpunit --testsuite integration
