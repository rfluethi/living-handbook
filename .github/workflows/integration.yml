name: Integration

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration tests (WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        # The declared minimum and the current release. Testing only against
        # trunk meant "Requires at least" was never actually verified, and an
        # unrelated core change could turn the build red.
        wordpress: [ '6.8', 'latest' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, zip, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # wp-phpunit ships the test framework but not WordPress itself, so a core
      # checkout is needed for ABSPATH. This mirrors the local recipe in
      # CONTRIBUTING.md.
      - name: Download WordPress core
        run: |
          if [ "${{ matrix.wordpress }}" = "latest" ]; then
            git clone --depth=1 https://github.com/WordPress/WordPress.git /tmp/wordpress
          else
            git clone --depth=1 --branch "${{ matrix.wordpress }}" https://github.com/WordPress/WordPress.git /tmp/wordpress
          fi

      - name: Write wp-tests-config
        run: |
          cat > wp-tests-config.php <<'PHP'
          <?php
          define( 'ABSPATH', '/tmp/wordpress/' );
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          $table_prefix = 'wptests_';
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'Test' );
          define( 'WP_PHP_BINARY', 'php' );
          PHP

      - name: Run integration tests
        env:
          LH_INTEGRATION: 1
          WP_TESTS_CONFIG_FILE_PATH: ${{ github.workspace }}/wp-tests-config.php
        run: vendor/bin/phpunit --testsuite integration
