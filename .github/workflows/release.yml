name: Release

# When a release is published on GitHub, build the installable plugin ZIP and
# attach it to that release, so it can be downloaded straight from the release
# page. Create the release as usual (tag and notes); this fills in the ZIP.

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    name: Build and attach the plugin ZIP
    runs-on: ubuntu-latest
    # A prerelease is a deliberate try-out and does not get a built ZIP.
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      # Guard against a mismatch: the tag should match the plugin version in the
      # header, so the attached ZIP is the one the release claims to be.
      - name: Check the tag matches the plugin version
        run: |
          version="$(grep -oE "Version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+" living-handbook.php | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")"
          tag="${GITHUB_REF_NAME#[vV]}"
          if [ "$version" != "$tag" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match plugin version '$version'." >&2
            echo "Tag the release v$version (or $version) so the ZIP matches." >&2
            exit 1
          fi
          echo "Tag and version agree on $version."

      # A release must not be built from code that would fail CI. The checks
      # are the same ones ci.yml runs; running them here as well means a release
      # can never be published from a red commit, however the tag was created.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPCS
        run: composer lint

      - name: PHPStan
        run: composer analyze

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

      # The checks above run on the plugin's minimum PHP, 8.1, because that is
      # what they are for. PHP-Scoper does not run there: its phar requires 8.2
      # or newer. So the build tooling gets its own PHP, after the gate and
      # before the build. Composer still resolves for 8.1, that is pinned in
      # composer.json under config.platform, so the shipped vendor is the same
      # either way.
      - name: PHP for the build tooling
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      # The checks above run on the plugin's minimum PHP, 8.1, because that is
      # what they are for. PHP-Scoper does not run there: its phar requires 8.2
      # or newer. So the build tooling gets its own PHP, after the gate and
      # before the build. Composer still resolves for 8.1, that is pinned in
      # composer.json under config.platform, so the shipped vendor is the same
      # either way.
      - name: PHP for the build tooling
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      # The build moves the bundled libraries into the plugin's own namespace,
      # so it needs PHP-Scoper. The version is pinned: a build tool that changes
      # under a release is a release that cannot be reproduced. It must be 0.18.19
      # or newer, older releases leave the PHP files unprefixed on PHP 8.5.
      - name: Install PHP-Scoper
        run: |
          mkdir -p tools
          curl -sSfL -o tools/php-scoper.phar \
            https://github.com/humbug/php-scoper/releases/download/0.18.19/php-scoper.phar
          php tools/php-scoper.phar --version

      # bin/build.sh installs the production dependencies, prefixes them and
      # produces living-handbook-<version>.zip with only the files that ship.
      - name: Build the plugin ZIP
        run: bash bin/build.sh

      - name: Attach the ZIP to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" living-handbook-*.zip --clobber
