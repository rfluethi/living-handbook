<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Schematischer Aufbau der Einstiegsseite eines Handbuchs">
  <title>Aufbau der Einstiegsseite</title>
  <desc>Schema der Einstiegsseite: oben Titel und Beschreibung des Handbuchs, links die Navigation als Seitenbaum, rechts ein großes Suchfeld, darunter die Bereichs-Kacheln, die zuletzt aktualisierten Seiten und am rechten Rand die Filter nach Seitentyp, Thema, Rolle und Zielgruppe.</desc>
  <rect width="860" height="560" fill="#ffffff"/>
  <rect x="10" y="10" width="840" height="540" rx="10" fill="#fafafa" stroke="#cccccc"/>

  <!-- Kopf -->
  <text x="40" y="58" font-size="26" font-weight="700" fill="#1d2327">Handbuch „Allgemein“</text>
  <text x="40" y="84" font-size="14" fill="#555555">Beschreibung des Handbuchs, wie du sie beim Anlegen eingetragen hast.</text>

  <!-- Navigation links -->
  <rect x="40" y="110" width="180" height="410" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="56" y="138" font-size="14" font-weight="700" fill="#1d2327">▾ Navigation</text>
  <line x1="40" y1="152" x2="220" y2="152" stroke="#dddddd"/>
  <text x="56" y="178" font-size="13" fill="#2c5f8a">Erste Schritte</text>
  <text x="72" y="200" font-size="12" fill="#555555">Installation</text>
  <text x="72" y="220" font-size="12" fill="#555555">Erstes Handbuch</text>
  <text x="56" y="246" font-size="13" fill="#2c5f8a">Inhalte</text>
  <text x="56" y="272" font-size="13" fill="#2c5f8a">Pflege</text>

  <!-- Suche -->
  <rect x="250" y="110" width="380" height="42" rx="21" fill="#ffffff" stroke="#2c5f8a" stroke-width="1.5"/>
  <circle cx="275" cy="131" r="7" fill="none" stroke="#2c5f8a" stroke-width="2"/>
  <line x1="280" y1="136" x2="287" y2="143" stroke="#2c5f8a" stroke-width="2"/>
  <text x="300" y="136" font-size="14" fill="#888888">Im Handbuch suchen …</text>

  <!-- Bereiche -->
  <text x="250" y="192" font-size="15" font-weight="700" fill="#1d2327">Bereiche</text>
  <rect x="250" y="206" width="182" height="86" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="264" y="234" font-size="13" font-weight="600" fill="#2c5f8a">Erste Schritte</text>
  <text x="264" y="254" font-size="12" fill="#555555">4 Seiten</text>
  <rect x="448" y="206" width="182" height="86" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="462" y="234" font-size="13" font-weight="600" fill="#2c5f8a">Pflege</text>
  <text x="462" y="254" font-size="12" fill="#555555">3 Seiten</text>

  <!-- Zuletzt aktualisiert -->
  <text x="250" y="336" font-size="15" font-weight="700" fill="#1d2327">Zuletzt aktualisiert</text>
  <rect x="250" y="350" width="380" height="48" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
  <circle cx="270" cy="374" r="6" fill="#176e3c"/>
  <text x="286" y="371" font-size="13" fill="#2c5f8a">Der Prüfzyklus</text>
  <text x="286" y="389" font-size="11" fill="#777777">Anleitung · aktualisiert am 23.07.2026</text>
  <rect x="250" y="408" width="380" height="48" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
  <rect x="264" y="426" width="12" height="12" rx="3" fill="#8a5200"/>
  <text x="286" y="429" font-size="13" fill="#2c5f8a">Feedback auswerten</text>
  <text x="286" y="447" font-size="11" fill="#777777">Anleitung · Prüfung fällig</text>

  <!-- Filter rechts -->
  <rect x="660" y="110" width="160" height="346" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="676" y="138" font-size="14" font-weight="700" fill="#1d2327">Filter</text>
  <text x="676" y="168" font-size="12" font-weight="600" fill="#555555">Seitentyp</text>
  <rect x="676" y="178" width="12" height="12" rx="2" fill="none" stroke="#999999"/>
  <text x="694" y="189" font-size="12" fill="#555555">Anleitung</text>
  <rect x="676" y="198" width="12" height="12" rx="2" fill="none" stroke="#999999"/>
  <text x="694" y="209" font-size="12" fill="#555555">Hintergrund</text>
  <text x="676" y="240" font-size="12" font-weight="600" fill="#555555">Thema</text>
  <rect x="676" y="250" width="12" height="12" rx="2" fill="none" stroke="#999999"/>
  <text x="694" y="261" font-size="12" fill="#555555">Applikation</text>
  <text x="676" y="292" font-size="12" font-weight="600" fill="#555555">Rolle</text>
  <rect x="676" y="302" width="12" height="12" rx="2" fill="none" stroke="#999999"/>
  <text x="694" y="313" font-size="12" fill="#555555">Redaktion</text>
  <text x="676" y="344" font-size="12" font-weight="600" fill="#555555">Zielgruppe</text>
  <rect x="676" y="354" width="12" height="12" rx="2" fill="none" stroke="#999999"/>
  <text x="694" y="365" font-size="12" fill="#555555">Alle Mitglieder</text>
  <text x="676" y="400" font-size="12" fill="#2c5f8a" text-decoration="underline">Filter zurücksetzen</text>
</svg>
